# Local development stack. Runs alongside any existing Postgres on 5432.
#   npm run stack:up          # postgres + elasticsearch + mailpit
#   npm run stack:up:stripe   # + Stripe CLI webhook forwarding (needs STRIPE_SECRET_KEY)
#   npm run stack:full        # the whole app in containers (profile "full"): postgres, elasticsearch,
#                             # mailpit, init jobs, web (storefront + API), worker, dagster
#   npm run scan:zap          # OWASP ZAP baseline against the running app (profile "security")
#   npm run test:load         # k6 load test against the running app (profile "load")
#   npm run stack:observability  # Jaeger for traces, UI on :16686 (profile "observability")
# All credentials below are local-development defaults only; override via environment.
name: grocery

services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocery_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      # Passwords for the least-privilege roles created by ./postgres/init/01-roles.sh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_dev_only}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-local_dev_only}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - grocery-pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-time init Postgres runs a temporary socket-only server, and a
      # socket check would report healthy before the real server (and the init script's roles) exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    container_name: grocery-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - grocery-es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: grocery-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: grocery-stripe-cli
    profiles: ["stripe"]
    environment:
      # Only needed when this profile runs; the CLI exits with a clear error if it is empty.
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: >
      listen
      --forward-to http://host.docker.internal:3000/api/webhooks/stripe
      --forward-connect-to http://host.docker.internal:3000/api/webhooks/stripe-connect
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.expired,payment_intent.canceled,payment_intent.payment_failed,account.updated,refund.updated,refund.failed,charge.refund.updated,charge.dispute.created,charge.dispute.updated,charge.dispute.closed,charge.dispute.funds_reinstated,payout.created,payout.updated,payout.paid,payout.failed,payout.canceled
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OWASP ZAP baseline (G6-02): spiders the running app and reports passive findings.
  #   npm run scan:zap   (the app must be running on :3000, e.g. npm run start:sim)
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: grocery-zap
    profiles: ["security"]
    command: >
      zap-baseline.py
      -t ${ZAP_TARGET:-http://host.docker.internal:3000}
      -c rules.tsv
      -J zap-report.json
      -r zap-report.html
      -m 3
      -I
    volumes:
      - ./zap:/zap/wrk:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Traces (G6-08): Jaeger with an OTLP receiver. Start with `npm run stack:observability`, run the
  # app and worker with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, open http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    container_name: grocery-jaeger
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  # k6 load test (G6-06) against the running app: npm run test:load
  k6:
    image: grafana/k6:1.3.0
    container_name: grocery-k6
    profiles: ["load"]
    command: run /scripts/storefront.js
    environment:
      BASE_URL: ${LOAD_TARGET:-http://host.docker.internal:3000}
      LOAD_DURATION: ${LOAD_DURATION:-2m}
    volumes:
      - ../tests/load:/scripts:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- Full stack (profile "full"): `npm run stack:full` --------------------------------------
  # Everything runs in containers with the payment simulator, so no Stripe account is needed.
  #   storefront + API  http://localhost:3000     (Next.js + Payload: pages, /api routes, admin)
  #   Dagster UI        http://localhost:3070
  #   Mailpit           http://localhost:8025
  # Startup order: postgres -> migrate (schema + synthetic seed) -> web-init (Payload tables, demo
  # users, search index) -> web, worker. Local-development credentials only.

  # Applies db/migrations, loads the synthetic catalogue through the pipeline, then exits.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/pipeline.Dockerfile
    image: grocery-pipeline
    profiles: ["full"]
    command: ["sh", "-c", "node /app/db/migrate.mjs && node /app/db/seed/seed.mjs"]
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-grocery_admin}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-grocery}  # secret-scan:allow local-dev default
      SEED_DATABASE_URL: postgres://${POSTGRES_USER:-grocery_admin}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-grocery}  # secret-scan:allow local-dev default
      INGEST_DATABASE_URL: postgres://ingest_rw:${INGEST_DB_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-grocery}  # secret-scan:allow local-dev default
    depends_on:
      postgres:
        condition: service_healthy

  # Dagster: the ingest jobs and schedules (UI and daemon in one process).
  dagster:
    image: grocery-pipeline
    container_name: grocery-dagster
    profiles: ["full"]
    environment:
      INGEST_DATABASE_URL: postgres://ingest_rw:${INGEST_DB_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-grocery}  # secret-scan:allow local-dev default
      CATALOG_CONNECTOR: ${CATALOG_CONNECTOR:-fixture}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${DAGSTER_PORT:-3070}:3070"
    volumes:
      - grocery-dagster:/app/.dagster
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Creates the Payload tables (NODE_ENV=development lets Payload push its schema), the demo
  # accounts and the first search index, then exits.
  web-init:
    build:
      context: ../web/summerhill-commerce
      dockerfile: ../../infra/docker/web.Dockerfile
    image: grocery-web
    profiles: ["full"]
    env_file: ../web/summerhill-commerce/stack.env
    environment:
      <<: &web-env
        DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD:-local_dev_only}@postgres:5432/payload  # secret-scan:allow local-dev default
        CATALOG_DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-grocery}  # secret-scan:allow local-dev default
        ELASTICSEARCH_URL: http://elasticsearch:9200
        SMTP_HOST: mailpit
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-dev-only-change-me-0123456789abcdef}
        PAYMENT_PROVIDER: simulator
        # Required by the config but never called while the simulator is on  # secret-scan:allow placeholder
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder_not_used_by_simulator}  # secret-scan:allow placeholder
        ALLOW_PAYMENT_SIMULATOR: "true"
      NODE_ENV: development
    command:
      - sh
      - -c
      - node ./node_modules/payload/bin.js run src/scripts/seed-demo-users.ts && node ./node_modules/payload/bin.js run src/scripts/sync-payload-catalog.ts && node ./node_modules/payload/bin.js run src/scripts/search-rebuild.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  # Storefront and API: the Next.js app (pages, /api routes, Payload admin at /admin).
  web:
    image: grocery-web
    container_name: grocery-web
    profiles: ["full"]
    env_file: ../web/summerhill-commerce/stack.env
    environment:
      <<: *web-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      web-init:
        condition: service_completed_successfully

  # Background jobs: order processing, outbox, search sync, payouts (Postgres-backed queue).
  worker:
    image: grocery-web
    container_name: grocery-worker
    profiles: ["full"]
    env_file: ../web/summerhill-commerce/stack.env
    environment:
      <<: *web-env
    command: ["node", "./node_modules/tsx/dist/cli.mjs", "src/worker/main.ts"]
    depends_on:
      web-init:
        condition: service_completed_successfully

volumes:
  grocery-dagster:
  grocery-pg:
  grocery-es:
