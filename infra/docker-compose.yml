# Local development stack. Runs alongside any existing Postgres on 5432.
#   npm run stack:up          # postgres + elasticsearch + mailpit
#   npm run stack:up:stripe   # + Stripe CLI webhook forwarding (needs STRIPE_SECRET_KEY)
#   npm run scan:zap          # OWASP ZAP baseline against the running app (profile "security")
#   npm run test:load         # k6 load test against the running app (profile "load")
#   npm run stack:observability  # Jaeger for traces, UI on :16686 (profile "observability")
# All credentials below are local-development defaults only; override via environment.
name: grocery

services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocery_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      # Passwords for the least-privilege roles created by ./postgres/init/01-roles.sh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_dev_only}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-local_dev_only}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - grocery-pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-time init Postgres runs a temporary socket-only server, and a
      # socket check would report healthy before the real server (and the init script's roles) exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    container_name: grocery-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - grocery-es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: grocery-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: grocery-stripe-cli
    profiles: ["stripe"]
    environment:
      # Only needed when this profile runs; the CLI exits with a clear error if it is empty.
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: >
      listen
      --forward-to http://host.docker.internal:3000/api/webhooks/stripe
      --forward-connect-to http://host.docker.internal:3000/api/webhooks/stripe-connect
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.expired,payment_intent.canceled,payment_intent.payment_failed,account.updated
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OWASP ZAP baseline (G6-02): spiders the running app and reports passive findings.
  #   npm run scan:zap   (the app must be running on :3000, e.g. npm run start:sim)
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: grocery-zap
    profiles: ["security"]
    command: >
      zap-baseline.py
      -t ${ZAP_TARGET:-http://host.docker.internal:3000}
      -c rules.tsv
      -J zap-report.json
      -r zap-report.html
      -m 3
      -I
    volumes:
      - ./zap:/zap/wrk:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Traces (G6-08): Jaeger with an OTLP receiver. Start with `npm run stack:observability`, run the
  # app and worker with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, open http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    container_name: grocery-jaeger
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  # k6 load test (G6-06) against the running app: npm run test:load
  k6:
    image: grafana/k6:1.3.0
    container_name: grocery-k6
    profiles: ["load"]
    command: run /scripts/storefront.js
    environment:
      BASE_URL: ${LOAD_TARGET:-http://host.docker.internal:3000}
      LOAD_DURATION: ${LOAD_DURATION:-2m}
    volumes:
      - ../tests/load:/scripts:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grocery-pg:
  grocery-es:
