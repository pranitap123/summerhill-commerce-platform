[project]
name = "catalog-pipeline"
version = "0.3.0"
description = "Catalogue ingestion pipeline for the grocery marketplace demo (synthetic data by default)"
requires-python = ">=3.12"
# Pinned versions live in requirements.txt

[tool.dagster]
module_name = "catalog_pipeline.definitions"
code_location_name = "catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the compose Postgres (npm run stack:up)"]
addopts = "-q"
